[package]
name = "aether-validator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "AETHER Validator - Node binary for participating in AETHER consensus"

[dependencies]
# Workspace dependencies
solana-sdk = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Local crates
aether-core = { path = "../aether-core" }
aether-consensus = { path = "../aether-consensus" }
aether-network = { path = "../aether-network" }
aether-storage = { path = "../../aether-storage" }

# Gossip & P2P
libp2p = { workspace = true }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "aether-validator"
path = "src/main.rs"
