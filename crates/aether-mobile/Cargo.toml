[package]
name = "aether-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Jelly-legs AI Team"]
description = "AETHER Mobile Mining - Proof-of-Work for AI compute attribution on mobile devices"

[dependencies]
# Cryptography
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha3 = "0.10"
digest = "0.10"
rand = "0.8"
rand_core = "0.6"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async traits
async-trait = "0.1"

# Rate limiting
tokio-ratelimit = "0.3"

[dev-dependencies]
criterion = "0.5"
[[bench]]
name = "benchmark"
harness = false
