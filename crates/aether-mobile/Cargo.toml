[package]
name = "aether-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Jelly-legs AI Team"]
description = "AETHER Mobile Mining - Proof-of-Work for AI compute attribution on mobile devices"

[dependencies]
# Cryptography
sha2 = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
