[workspace]
members = [
    "aether-core",
    "aether-consensus",
    "aether-poh",
    "aether-ai-lanes",
    "aether-network",
    "aether-storage",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AETHER Team <team@aether-network.io>"]
license = "Apache-2.0"
repository = "https://github.com/jelly-legs-ai/Jelly-legs-unsteady-workshop"
homepage = "https://aether-network.io"
keywords = ["blockchain", "solana", "agave", "ai", "consensus"]
categories = ["cryptography", "network-programming"]
rust-version = "1.75"

[workspace.dependencies]
# Agave/Solana dependencies
solana-sdk = "^1.18"
solana-program = "^1.18"
solana-runtime = "^1.18"
solana-ledger = "^1.18"
solana-poh = "^1.18"
solana-core = "^1.18"
solana-gossip = "^1.18"
solana-streamer = "^1.18"

# Core dependencies
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Cryptography
sha2 = "0.10"
blake3 = "1.5"
ed25519-dalek = "2.1"

# Consensus
libp2p = { version = "0.53", features = ["tokio", "tcp", "dns", "noise", "yamux", "gossipsub", "mdns", "kad"] }

# AI/ML
burn = "0.13"
ndarray = "0.15"

# Testing
[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1