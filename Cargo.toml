[workspace]
members = [
    "crates/aether-common",
    "crates/aether-consensus",
    "crates/aether-ai-priority",
    "crates/aether-mobile",
    "crates/aether-core",
    "crates/aether-governance",
    "crates/aether-privacy",
    "crates/aether-validator",
    "crates/aether-tokens",
    "aether-core",
    "aether-poh",
    "aether-consensus",
    "aether-network",
    "aether-storage",
    "aether-ai-lanes",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AETHER Team <team@aether-network.io>"]
license = "Apache-2.0"
repository = "https://github.com/jelly-legs-ai/Jelly-legs-unsteady-workshop"
homepage = "https://aether-network.io"
keywords = ["blockchain", "solana", "agave", "ai", "consensus"]
categories = ["cryptography", "network-programming"]
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
borsh = { version = "1.6", features = ["derive"] }

# Error handling
thiserror = { version = "1.0" }
anyhow = { version = "1.0" }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
log = "0.4"
env_logger = "0.11"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Utilities
bs58 = "0.5"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }

# Cryptography
sha2 = "0.10"
blake3 = "1.5"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "serde", "rand_core"] }

# P2P
libp2p = { version = "0.55", features = ["tokio", "tcp", "dns", "noise", "yamux", "gossipsub", "mdns", "kad"] }

# Time
chrono = "0.4"

# Benchmarking
criterion = "0.5"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
