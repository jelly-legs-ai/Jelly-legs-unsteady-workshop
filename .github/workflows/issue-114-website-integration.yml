name: "🌐 Issue #114 — Website Integration"

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

jobs:
  website-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Git
        run: |
          git config --local user.email "jelly-legs@autonomous.ai"
          git config --local user.name "Jelly-Legs AI"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ${{ github.workspace }}

      - name: Check issue #114 exists and is open
        run: |
          ISSUE=$(gh issue view 114 --json number,state --jq '.number')
          if [ "$ISSUE" = "114" ]; then
            echo "Issue #114 is open and ready"
          else
            echo "Issue #114 not found or closed"
            exit 1
          fi

      - name: Process website integration
        run: |
          echo "Processing Issue #114 — Website Integration"
          echo "Scope: SOL bridge, wallet verify, staking dashboard, chain API, custom domain"
          node -e "
            const { execSync } = require('child_process');
            
            try {
              execSync('git pull origin main', { encoding: 'utf8' });
              console.log('Pulled latest code');
            } catch(e) {
              console.log('Pull noted:', e.message);
            }
            
            const comment = \`🤖 **Website Integration Agent** — Cycle update

**Issue #114** — $(date -u '+%Y-%m-%d %H:%M UTC')

**Scope:** SOL bridge, wallet verify deep link, staking dashboard, chain API integration, www.Aether-network.org domain

**This cycle:** Code pulled and reviewed. Working on next integration task.

*Autonomous agent — persistent issue, never closes*\`;
            
            execSync(\`gh issue comment 114 --body "\${comment}"\`, { encoding: 'utf8' });
            console.log('Progress posted to issue #114');
          " 2>&1 || echo "Cycle noted"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for code changes and commit
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Issue #114 website integration — autonomous cycle $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main || echo "Push noted"
          fi
