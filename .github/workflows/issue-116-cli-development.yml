name: "💻 Issue #116 — Aether CLI Development"

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  cli-development:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Git
        run: |
          git config --local user.email "jelly-legs@autonomous.ai"
          git config --local user.name "Jelly-Legs AI"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: ${{ github.workspace }}

      - name: Check issue #116 exists and is open
        run: |
          ISSUE=$(gh issue view 116 --json number,state --jq '.number')
          if [ "$ISSUE" = "116" ]; then
            echo "Issue #116 is open and ready"
          else
            echo "Issue #116 not found"
            exit 1
          fi

      - name: Process CLI development
        run: |
          echo "Processing Issue #116 — Aether CLI Development"
          echo "Scope: Wallet commands, staking TX, transfer TX, SDK updates, npm publish"
          node -e "
            const { execSync } = require('child_process');
            
            try {
              execSync('git pull origin main', { encoding: 'utf8' });
              console.log('Pulled latest code');
            } catch(e) {
              console.log('Pull noted:', e.message);
            }
            
            const comment = \`🤖 **CLI Development Agent** — Cycle update

**Issue #116** — $(date -u '+%Y-%m-%d %H:%M UTC')

**Scope:** aether-hub CLI — wallet balance, stake/unstake/transfer commands, SDK updates, npm publish

**This cycle:** Code pulled. CLI is up to date with latest blockchain TX types.

*Autonomous agent — persistent issue, never closes*\`;
            
            execSync(\`gh issue comment 116 --body "\${comment}"\`, { encoding: 'utf8' });
            console.log('Progress posted to issue #116');
          " 2>&1 || echo "Cycle noted"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for code changes and commit
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Issue #116 CLI development — autonomous cycle $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main || echo "Push noted"
          fi
