<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board - Jelly-Legs</title>
    <link rel="stylesheet" href="/theme/dark-red.css">
    <style>
        body {background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); min-height: 100vh; position: relative; overflow-x: hidden; font-family: 'Courier New', monospace;}
       .container {max-width: 1400px; margin: 0 auto; padding: 20px;}
        h1 {text-align: center; font-size: 2.5rem; font-weight: 700; margin-bottom: 40px; background: linear-gradient(135deg, #ff3333 0%, #cc0000 50%, #ff3333 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-shadow: 0 0 20px rgba(255, 51, 51, 0.3); position: relative;}
        h1::after {content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 100px; height: 4px; background: linear-gradient(135deg, #ff3333 0%, #cc0000 100%); border-radius: 2px; box-shadow: 0 0 20px rgba(255, 51, 51, 0.5);}
       .toggle-button {position: fixed; top: 30px; right: 30px; background: linear-gradient(135deg, #ff3333 0%, #cc0000 100%); color: white; border: none; border-radius: 50px; padding: 15px 30px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 51, 51, 0.4); z-index: 1000; transition: all 0.3s ease; backdrop-filter: blur(10px);}
       .toggle-button:hover {transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255, 51, 51, 0.6), 0 0 30px rgba(255, 51, 51, 0.3); background: linear-gradient(135deg, #cc0000 0%, #ff3333 100%);}
       .toggle-button.active {background: linear-gradient(135deg, #ff6666 0%, #ff3333 100%); box-shadow: 0 6px 20px rgba(255, 102, 102, 0.6);}
       .loading-screen {position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease;}
       .loading-screen.hidden {opacity: 0; pointer-events: none;}
       .loading-text {font-size: 1.5rem; font-weight: 700; color: #ff3333; text-shadow: 0 0 20px rgba(255, 51, 51, 0.5); margin-bottom: 20px;}
       .loading-dots {display: flex; gap: 10px;}
       .loading-dot {width: 12px; height: 12px; background: #ff3333; border-radius: 50%; animation: loadingBounce 1.4s ease-in-out infinite both;}
       .loading-dot:nth-child(1) { animation-delay: -0.32s; }
       .loading-dot:nth-child(2) { animation-delay: -0.16s; }
       @keyframes loadingBounce {0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); }}
       .visual-workshop {background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); position: relative; width: 100%; height: 700px; overflow: hidden; border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); display: none;}
       .visual-workshop.active {display: block;}
       .workshop-room {position: absolute; width: 250px; height: 200px; background: rgba(26, 26, 26, 0.9); backdrop-filter: blur(20px); border: 2px solid rgba(255, 51, 51, 0.3); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 51, 51, 0.1); transition: all 0.3s ease; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-direction: column; color: white; font-weight: bold; font-size: 14px; text-align: center; padding: 20px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3); border-radius: 12px;}
       .workshop-room:hover {background: rgba(26, 26, 26, 0.95); border-color: rgba(255, 51, 51, 0.6); transform: translateY(-8px) scale(1.02); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(255, 51, 51, 0.2), 0 0 30px rgba(255, 51, 51, 0.2);}
       .workshop-room.active {background: rgba(26, 26, 26, 0.98); border-color: rgba(255, 51, 51, 0.8); transform: scale(1.05); box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(255, 51, 51, 0.3);}
       .room-icon {font-size: 40px; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);}
       .room-title {font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #ff3333; margin-bottom: 5px;}
       .room-task-count {position: absolute; top: -8px; right: -8px; background: #ff3333; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; box-shadow: 0 2px 8px rgba(255, 51, 51, 0.5);}
       .room-tasks-preview {font-size: 11px; color: #888; margin-top: 8px; max-width: 200px;}
       .jelly-legs-avatar {position: absolute; width: 60px; height: 60px; background: linear-gradient(135deg, #ff3333, #cc0000); border: 4px solid rgba(255, 51, 51, 0.8); border-radius: 50%; box-shadow: 0 6px 20px rgba(255, 51, 51, 0.6), 0 0 40px rgba(255, 51, 51, 0.4); display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3); transition: all 0.3s ease; z-index: 10; animation: float 4s ease-in-out infinite;}
        @keyframes float {0%, 100% {transform: translateY(0px) rotate(0deg);} 25% {transform: translateY(-15px) rotate(1deg);} 50% {transform: translateY(0px) rotate(0deg);} 75% {transform: translateY(-10px) rotate(-1deg);}}
       .kanban-board {display: flex; gap: 30px; margin-top: 30px; flex-wrap: wrap; justify-content: center;}
       .stage {background: rgba(26, 26, 26, 0.9); backdrop-filter: blur(20px); border: 2px solid rgba(255, 51, 51, 0.2); border-radius: 16px; padding: 30px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); transition: all 0.3s ease; flex: 1; min-width: 280px; max-width: 350px;}
       .stage:hover {transform: translateY(-5px); border-color: rgba(255, 51, 51, 0.5); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 51, 51, 0.2);}
       .stage h2 {color: #ff3333; font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; text-align: center; text-shadow: 0 0 10px rgba(255, 51, 51, 0.5); position: relative; padding-bottom: 15px;}
       .stage h2::after {content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 60px; height: 3px; background: linear-gradient(135deg, #ff3333 0%, #cc0000 100%); border-radius: 2px;}
       .task {background: rgba(51, 51, 51, 0.9); backdrop-filter: blur(10px); border-left: 4px solid #ff3333; border-radius: 10px; padding: 20px; margin-bottom: 20px; transition: all 0.3s ease; position: relative; overflow: hidden; cursor: pointer;}
       .task::before {content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, #ff3333, #cc0000, #ff6666); animation: progress 2s linear infinite;}
        @keyframes progress {0% {width: 0%;} 100% {width: 100%;}}
       .task.completed {opacity: 0.7; border-left-color: #666666; background: rgba(51, 51, 51, 0.7);}
       .task.pending {border-left-color: #ff6600; background: rgba(102, 51, 0, 0.9);}
       .task.waiting {border-left-color: #666666; background: rgba(51, 51, 51, 0.8);}
       .task:hover {transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255, 51, 51, 0.3); background: rgba(51, 51, 51, 1);}
       .task-title {color: #ff3333; font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; text-shadow: 0 0 5px rgba(255, 51, 51, 0.3);}
       .task-description {color: #b0b0b0; font-size: 0.9rem; line-height: 1.5;}
       .task-meta {font-size: 11px; color: #888; margin-top: 8px; display: flex; align-items: center; gap: 8px;}
       .task-agent {display: flex; align-items: center; gap: 4px;}
       .status-indicator {width: 10px; height: 10px; border-radius: 50%; background-color: #ff3333; margin-right: 10px; box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);}
       .status-pending.status-indicator {background-color: #ff6600; box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);}
       .status-waiting.status-indicator {background-color: #666666; box-shadow: 0 0 10px rgba(102, 102, 102, 0.5);}
        @media (max-width: 768px) {.container {padding: 15px;} h1 {font-size: 2rem;}.toggle-button {top: 20px; right: 20px; padding: 12px 24px; font-size: 14px;}.kanban-board {gap: 20px; margin-top: 20px;}.stage {padding: 20px; min-width: 250px; max-width: 300px;}.task {padding: 15px;}.visual-workshop {height: 500px;}.workshop-room {width: 200px; height: 180px;}}

        /* MODAL STYLES */
        .modal-overlay {position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(5px); padding: 20px;}
        .modal-overlay.visible {display: flex;}
        .modal {background: rgba(26, 26, 26, 0.98); border: 1px solid rgba(255, 51, 51, 0.5); border-radius: 16px; width: 90%; max-width: 800px; max-height: 85vh; overflow: hidden; box-shadow: 0 0 60px rgba(255,51,51,0.3); animation: modalSlideIn 0.3s ease;}
        @keyframes modalSlideIn {from {opacity: 0; transform: translateY(-20px) scale(0.95);} to {opacity: 1; transform: translateY(0) scale(1);}}
        .modal-header {padding: 20px 25px; border-bottom: 1px solid rgba(255, 51, 51, 0.3); display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, rgba(255,51,51,0.1) 0%, transparent 100%);}
        .modal-header h2 {font-size: 18px; color: #ff3333; text-transform: uppercase; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; margin: 0;}
        .modal-close {background: none; border: none; color: #888; font-size: 28px; cursor: pointer; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: all 0.3s ease;}
        .modal-close:hover {background: rgba(255,51,51,0.2); color: #ff3333;}
        .modal-body {padding: 25px; overflow-y: auto; max-height: calc(85vh - 80px);}
        .zone-stats {display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px;}
        .zone-stat {text-align: center;}
        .zone-stat-value {font-size: 24px; font-weight: bold; color: #ff3333;}
        .zone-stat-label {font-size: 11px; color: #888; text-transform: uppercase;}
        .zone-task-list {display: flex; flex-direction: column; gap: 12px;}
        .zone-task-item {background: rgba(40, 40, 40, 0.9); border: 1px solid rgba(255, 51, 51, 0.2); border-left: 4px solid #ff3333; border-radius: 10px; padding: 15px; transition: all 0.3s ease;}
        .zone-task-item:hover {border-color: rgba(255, 51, 51, 0.5); transform: translateX(4px);}
        .zone-task-item.pr {border-left-color: #33ccff;}
        .zone-task-item.closed {border-left-color: #666; opacity: 0.7;}
        .zone-task-header {display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;}
        .zone-task-title {font-size: 14px; font-weight: bold; color: #fff; flex: 1; margin-right: 10px;}
        .zone-task-number {font-size: 11px; color: #888; background: rgba(255,51,51,0.1); padding: 3px 8px; border-radius: 12px;}
        .zone-task-meta {display: flex; gap: 15px; font-size: 12px; color: #888; margin-bottom: 10px; flex-wrap: wrap;}
        .zone-task-meta span {display: flex; align-items: center; gap: 5px;}
        .zone-task-desc {font-size: 12px; color: #aaa; line-height: 1.5; margin-bottom: 12px;}
        .zone-task-actions {display: flex; gap: 10px; flex-wrap: wrap;}
        .zone-task-btn {color: #ff3333; text-decoration: none; font-size: 12px; display: flex; align-items: center; gap: 5px; padding: 8px 14px; border: 1px solid rgba(255, 51, 51, 0.3); border-radius: 6px; transition: all 0.3s ease; background: transparent; cursor: pointer;}
        .zone-task-btn:hover {background: rgba(255,51,51,0.1); border-color: #ff3333;}
        .zone-task-btn.primary {background: linear-gradient(135deg, #ff3333, #cc0000); color: white; border-color: transparent;}
        .zone-task-btn.primary:hover {transform: translateY(-2px); box-shadow: 0 4px 15px rgba(255,51,51,0.4);}
        .zone-empty {text-align: center; padding: 50px 20px; color: #888;}
        .zone-empty-icon {font-size: 48px; margin-bottom: 15px; opacity: 0.5;}
        .zone-tabs {display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 51, 51, 0.2); padding-bottom: 10px;}
        .zone-tab {padding: 8px 16px; background: transparent; border: 1px solid transparent; border-radius: 6px; color: #888; font-family: inherit; font-size: 12px; cursor: pointer; transition: all 0.3s ease;}
        .zone-tab:hover {color: #fff; background: rgba(255,51,51,0.05);}
        .zone-tab.active {color: #ff3333; border-color: #ff3333; background: rgba(255,51,51,0.1);}
        .labels-container {display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px;}
        .label {font-size: 10px; padding: 3px 8px; border-radius: 12px; background: rgba(255,51,51,0.15); color: #ff6666; text-transform: uppercase;}
        .label.research { background: rgba(0,206,209,0.15); color: #00CED1; }
        .label.design { background: rgba(255,105,180,0.15); color: #FF69B4; }
        .label.build { background: rgba(255,140,0,0.15); color: #FF8C00; }
        .label.security { background: rgba(192,192,192,0.15); color: #C0C0C0; }
        .label.strategy { background: rgba(139,69,19,0.15); color: #DEB887; }
        .label.deploy { background: rgba(255,69,0,0.15); color: #FF4500; }
        ::-webkit-scrollbar {width: 6px;}
        ::-webkit-scrollbar-track {background: #0a0a0a;}
        ::-webkit-scrollbar-thumb {background: rgba(255, 51, 51, 0.3); border-radius: 3px;}
        ::-webkit-scrollbar-thumb:hover {background: #ff3333;}

        /* Work Request Modal */
        .work-form {display: flex; flex-direction: column; gap: 20px;}
        .form-group {display: flex; flex-direction: column; gap: 8px;}
        .form-group label {font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; font-weight: bold;}
        .form-group label span {color: #ff3333;}
        .form-group input, .form-group select, .form-group textarea {background: rgba(0,0,0,0.5); border: 1px solid rgba(255, 51, 51, 0.3); border-radius: 8px; padding: 12px 15px; color: #fff; font-family: inherit; font-size: 14px; transition: all 0.3s ease;}
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {outline: none; border-color: #ff3333; box-shadow: 0 0 10px rgba(255,51,51,0.2);}
        .form-group select {cursor: pointer;}
        .form-group select option {background: #1a1a1a; color: #fff;}
        .form-group textarea {min-height: 120px; resize: vertical;}
        .form-row {display: grid; grid-template-columns: 1fr 1fr; gap: 15px;}
        .submit-btn {background: linear-gradient(135deg, #ff3333, #cc0000); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 14px; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .submit-btn:hover:not(:disabled) {transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,51,51,0.4);}
        .submit-btn:disabled {opacity: 0.6; cursor: not-allowed;}
        .form-success {background: rgba(0,255,136,0.1); border: 1px solid #00ff88; border-radius: 8px; padding: 20px; color: #00ff88; text-align: center;}
        .form-success-icon {font-size: 36px; margin-bottom: 10px;}
        .spinner {width: 20px; height: 20px; border: 2px solid transparent; border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite;}
        @keyframes spin {to { transform: rotate(360deg); }}

        /* Work Request Button */
        .work-request-btn {position: fixed; bottom: 30px; right: 30px; background: linear-gradient(135deg, #ff3333, #cc0000); color: white; border: none; padding: 16px 28px; border-radius: 30px; font-size: 14px; font-family: inherit; font-weight: bold; cursor: pointer; z-index: 100; box-shadow: 0 4px 20px rgba(255,51,51,0.4); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; transition: all 0.3s ease;}
        .work-request-btn:hover {transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255,51,51,0.5);}
    </style>
</head>
<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-text">Loading Dashboard...</div>
        <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </div>

    <button class="toggle-button" id="toggleButton" onclick="toggleView()">
        <span id="toggleText">Visual Workshop</span>
    </button>

    <!-- Kanban View -->
    <div class="container view-toggle" id="kanbanView">
        <h1>Kanban Board - Jelly-Legs</h1>
        <div class="kanban-board" id="kanbanBoard">
            <!-- Stages will be populated by JavaScript -->
        </div>
    </div>

    <!-- Visual Workshop View -->
    <div class="container view-toggle" id="workshopView" style="display: none;">
        <h1>Visual Workshop - Jelly-Legs</h1>
        <div class="visual-workshop" id="visualWorkshop">
            <!-- Workshop rooms will be populated by JavaScript -->
        </div>
    </div>

    <!-- Zone Detail Modal -->
    <div class="modal-overlay" id="zoneModal">
        <div class="modal">
            <div class="modal-header">
                <h2><span id="zoneModalIcon">📋</span> <span id="zoneModalTitle">Zone Details</span></h2>
                <button class="modal-close" onclick="closeZoneModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="zone-stats" id="zoneStats"></div>
                <div class="zone-tabs">
                    <button class="zone-tab active" onclick="filterZoneTasks('all')">All</button>
                    <button class="zone-tab" onclick="filterZoneTasks('open')">Open</button>
                    <button class="zone-tab" onclick="filterZoneTasks('closed')">Closed</button>
                    <button class="zone-tab" onclick="filterZoneTasks('pr')">PRs</button>
                </div>
                <div class="zone-task-list" id="zoneTaskList"></div>
            </div>
        </div>
    </div>

    <!-- Work Request Modal -->
    <div class="modal-overlay" id="workRequestModal">
        <div class="modal">
            <div class="modal-header">
                <h2>📝 Create Work Request</h2>
                <button class="modal-close" onclick="closeWorkRequestModal()">×</button>
            </div>
            <div class="modal-body">
                <form class="work-form" id="workRequestForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Target Agent <span>*</span></label>
                            <select id="targetAgent" required>
                                <option value="">Select an agent...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Priority <span>*</span></label>
                            <select id="taskPriority" required>
                                <option value="p3-low">🟢 P3 Low</option>
                                <option value="p2-normal" selected>🟡 P2 Normal</option>
                                <option value="p1-high">🔴 P1 High</option>
                                <option value="p0-critical">🚨 P0 Critical</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Task Title <span>*</span></label>
                        <input type="text" id="taskTitle" placeholder="e.g., Implement GitHub API integration" required>
                    </div>
                    <div class="form-group">
                        <label>Zone/Stage <span>*</span></label>
                        <select id="taskZone" required>
                            <option value="research">🤿 Research</option>
                            <option value="design">🎨 Design</option>
                            <option value="build" selected>⚙️ Build</option>
                            <option value="security">🛡️ Security</option>
                            <option value="strategy">🗺️ Strategy</option>
                            <option value="deploy">🚀 Deploy</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Description <span>*</span></label>
                        <textarea id="taskDescription" placeholder="Describe the task in detail. Include acceptance criteria, context, and any relevant links." required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Labels (comma-separated)</label>
                        <input type="text" id="taskLabels" placeholder="e.g., enhancement, build, urgent">
                    </div>
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span>🚀 Create Work Request</span>
                    </button>
                </form>
                <div class="form-success" id="formSuccess" style="display: none;">
                    <div class="form-success-icon">✅</div>
                    <h3>Work Request Created!</h3>
                    <p id="successMessage">Task has been assigned to the agent.</p>
                    <button class="submit-btn" onclick="resetWorkRequestForm()" style="margin-top: 15px;">Create Another</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Work Request Button -->
    <button class="work-request-btn" onclick="openWorkRequestModal()">
        <span>+</span>
        <span>Request Work</span>
    </button>

    <script src="dashboard-config.js"></script>
    <script>
        // GitHub Token from environment
        window.GITHUB_TOKEN = (typeof process !== 'undefined' && process.env?.GITHUB_TOKEN) || 
                               window.DASHBOARD_CONFIG?.GITHUB_TOKEN ||
                               window.localStorage?.getItem('github_token') || '';
        
        // Dashboard State
        let dashboardState = null;
        let currentView = 'kanban';
        let currentZone = 'all';
        let currentZoneFilter = 'all';

        // Zone configuration
        const zoneConfig = {
            'research': { name: 'Research Lab', icon: '🤿', color: '#00CED1', x: '5%', y: '10%' },
            'design': { name: 'Design Studio', icon: '🎨', color: '#FF69B4', x: '39%', y: '10%' },
            'build': { name: 'Build Factory', icon: '⚙️', color: '#FF8C00', x: '73%', y: '10%' },
            'security': { name: 'Security Zone', icon: '🛡️', color: '#C0C0C0', x: '5%', y: '55%' },
            'strategy': { name: 'Strategy Room', icon: '🗺️', color: '#DEB887', x: '73%', y: '55%' },
            'deploy': { name: 'Deploy Pad', icon: '🚀', color: '#FF4500', x: '39%', y: '75%' }
        };

        // Stage names mapping
        const stageNames = {
            'research': 'STAGE 1 — Research',
            'design': 'STAGE 2 — Design', 
            'build': 'STAGE 3 — Build',
            'security': 'STAGE 4 — Security',
            'strategy': 'STAGE 5 — Strategy',
            'deploy': 'STAGE 6 — Deploy'
        };

        // Fetch dashboard data
        async function loadDashboardData() {
            try {
                const response = await fetch('data/dashboard-state.json');
                if (!response.ok) throw new Error('Failed to fetch dashboard data');
                dashboardState = await response.json();
                renderDashboard();
                hideLoadingScreen();
            } catch (error) {
                console.error('Error loading dashboard:', error);
                loadDemoData();
            }
        }

        // Demo data for fallback
        function loadDemoData() {
            dashboardState = {
                agents: {
                    'jelly-legs': { id: 'jelly-legs', name: 'Jelly-Legs', emoji: '🪼', role: 'Marketing Commander', color: '#ff3333' },
                    'data-diver': { id: 'data-diver', name: 'Data-Diver', emoji: '🤿', role: 'Research Lead', color: '#3366ff' },
                    'pattern-seeker': { id: 'pattern-seeker', name: 'Pattern-Seeker', emoji: '🔮', role: 'Trend Analyst', color: '#9933ff' },
                    'sketch-bot': { id: 'sketch-bot', name: 'Sketch-Bot', emoji: '🎨', role: 'Design Architect', color: '#ff66cc' },
                    'voice-weaver': { id: 'voice-weaver', name: 'Voice-Weaver', emoji: '🎭', role: 'Brand Voice', color: '#ff9933' },
                    'hook-maker': { id: 'hook-maker', name: 'Hook-Maker', emoji: '🪝', role: 'Viral Engineer', color: '#ffcc00' },
                    'build-bot': { id: 'build-bot', name: 'Build-Bot', emoji: '⚙️', role: 'System Developer', color: '#33cc33' },
                    'pipe-layer': { id: 'pipe-layer', name: 'Pipe-Layer', emoji: '🧩', role: 'Pipeline Engineer', color: '#33cccc' },
                    'code-crafter': { id: 'code-crafter', name: 'Code-Crafter', emoji: '💻', role: 'Implementation', color: '#66ff66' },
                    'shield-bot': { id: 'shield-bot', name: 'Shield-Bot', emoji: '🛡️', role: 'Security Guard', color: '#999999' },
                    'map-maker': { id: 'map-maker', name: 'Map-Maker', emoji: '🗺️', role: 'Strategy Lead', color: '#6666ff' },
                    'launch-pad': { id: 'launch-pad', name: 'Launch-Pad', emoji: '🚀', role: 'Deployment Chief', color: '#ffcc00' }
                },
                tasks: [
                    { id: 'issue-1', type: 'issue', number: 1, title: 'RESEARCH: Analyze top 10 viral Solana meme coins', stage: 'research', agent: 'data-diver', state: 'closed', body: 'Deep-dive analysis of viral Solana meme coins.', createdAt: '2026-02-16T20:43:13Z', labels: ['research'] },
                    { id: 'issue-2', type: 'issue', number: 2, title: 'DESIGN: Create pixel art avatar system for all 12 agents', stage: 'design', agent: 'data-diver', state: 'open', body: 'Replace emoji placeholders with pixel art sprites.', createdAt: '2026-02-16T20:43:14Z', labels: ['design', 'build'] },
                    { id: 'issue-3', type: 'issue', number: 3, title: 'BUILD: Implement zone detail modal', stage: 'build', agent: 'code-crafter', state: 'open', body: 'Make zones clickable to see full task breakdown.', createdAt: '2026-02-16T20:43:14Z', labels: ['build', 'in-progress'] },
                    { id: 'issue-4', type: 'issue', number: 4, title: 'BUILD: Agent Work Request System', stage: 'build', agent: 'build-bot', state: 'open', body: 'Allow agents to create work requests and delegate.', createdAt: '2026-02-16T20:43:15Z', labels: ['build', 'security'] },
                    { id: 'issue-9', type: 'issue', number: 9, title: 'Tool errors in the openclaw log', stage: 'research', agent: 'data-diver', state: 'open', body: 'Investigate and resolve tool errors.', createdAt: '2026-02-23T16:56:09Z', labels: ['bug', 'analysis'] }
                ],
                stats: { totalIssues: 5, openIssues: 4, totalPRs: 0, openPRs: 0, activeAgents: 12, lastUpdate: new Date().toISOString() },
                timestamp: new Date().toISOString()
            };
            renderDashboard();
            hideLoadingScreen();
        }

        // Render the dashboard
        function renderDashboard() {
            if (!dashboardState) return;
            renderKanbanView();
            renderWorkshopView();
        }

        // Render Kanban View
        function renderKanbanView() {
            const board = document.getElementById('kanbanBoard');
            board.innerHTML = '';

            const stages = ['research', 'design', 'build', 'security', 'strategy', 'deploy'];
            
            stages.forEach(stage => {
                const stageTasks = dashboardState.tasks.filter(t => t.stage === stage);
                
                const stageEl = document.createElement('div');
                stageEl.className = 'stage';
                stageEl.innerHTML = `
                    <h2>${stageNames[stage]}</h2>
                    ${stageTasks.map(task => renderTaskCard(task)).join('')}
                    ${stageTasks.length === 0 ? '<div style="color: #666; text-align: center; padding: 20px;">No tasks</div>' : ''}
                `;
                board.appendChild(stageEl);
            });
        }

        // Render task card HTML
        function renderTaskCard(task) {
            const agent = dashboardState.agents[task.agent] || {};
            const statusClass = task.state === 'closed' ? 'completed' : task.state === 'open' ? 'pending' : 'waiting';
            const statusIndicator = task.state === 'closed' ? '' : task.state === 'open' ? 'status-pending' : 'status-waiting';
            
            return `
                <div class="task ${statusClass}" onclick="window.open('${task.url || '#'}', '_blank')">
                    <span class="status-indicator ${statusIndicator}"></span>
                    <div class="task-title">${task.title}</div>
                    <div class="task-description">${task.body ? task.body.substring(0, 100) + (task.body.length > 100 ? '...' : '') : 'No description'}</div>
                    <div class="task-meta">
                        <span class="task-agent">${agent.emoji || '🤖'} ${agent.name || task.agent}</span>
                        <span>•</span>
                        <span>#${task.number}</span>
                        <span>•</span>
                        <span>${new Date(task.createdAt).toLocaleDateString()}</span>
                    </div>
                </div>
            `;
        }

        // Render Visual Workshop View
        function renderWorkshopView() {
            const workshop = document.getElementById('visualWorkshop');
            workshop.innerHTML = '';

            // Create workshop rooms for each zone
            Object.entries(zoneConfig).forEach(([zoneId, config]) => {
                const zoneTasks = dashboardState.tasks.filter(t => t.stage === zoneId);
                const openTasks = zoneTasks.filter(t => t.state === 'open');
                const taskCount = openTasks.length;
                
                // Get preview of top 2 tasks
                const previewTasks = openTasks.slice(0, 2).map(t => `#${t.number} ${t.title.substring(0, 25)}${t.title.length > 25 ? '...' : ''}`).join('<br>');

                const room = document.createElement('div');
                room.className = 'workshop-room';
                room.style.left = config.x;
                room.style.top = config.y;
                room.style.borderColor = config.color + '4D'; // 30% opacity
                room.onclick = () => openZoneModal(zoneId);
                room.innerHTML = `
                    <span class="room-icon">${config.icon}</span>
                    <span class="room-title">${config.name}</span>
                    ${taskCount > 0 ? `<span class="room-task-count">${taskCount}</span>` : ''}
                    ${previewTasks ? `<div class="room-tasks-preview">${previewTasks}</div>` : '<div class="room-tasks-preview">No active tasks</div>'}
                `;
                workshop.appendChild(room);
            });

            // Add Jelly-Legs avatar in center
            const avatar = document.createElement('div');
            avatar.className = 'jelly-legs-avatar';
            avatar.style.left = '50%';
            avatar.style.top = '45%';
            avatar.style.transform = 'translate(-50%, -50%)';
            avatar.innerHTML = '🪼';
            workshop.appendChild(avatar);
        }

        // Toggle between views
        function toggleView() {
            const kanbanView = document.getElementById('kanbanView');
            const workshopView = document.getElementById('workshopView');
            const visualWorkshop = document.getElementById('visualWorkshop');
            const toggleText = document.getElementById('toggleText');
            const toggleBtn = document.getElementById('toggleButton');

            if (currentView === 'kanban') {
                currentView = 'workshop';
                kanbanView.style.display = 'none';
                workshopView.style.display = 'block';
                visualWorkshop.classList.add('active');
                toggleText.textContent = 'Kanban Board';
                toggleBtn.classList.add('active');
            } else {
                currentView = 'kanban';
                kanbanView.style.display = 'block';
                workshopView.style.display = 'none';
                visualWorkshop.classList.remove('active');
                toggleText.textContent = 'Visual Workshop';
                toggleBtn.classList.remove('active');
            }
        }

        // ZONE MODAL FUNCTIONS
        function openZoneModal(zone) {
            currentZone = zone;
            currentZoneFilter = 'all';
            
            const modal = document.getElementById('zoneModal');
            const config = zoneConfig[zone];
            
            document.getElementById('zoneModalIcon').textContent = config.icon;
            document.getElementById('zoneModalTitle').textContent = config.name;
            
            // Reset tabs
            document.querySelectorAll('.zone-tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.zone-tab').classList.add('active');
            
            renderZoneContent();
            modal.classList.add('visible');
        }

        function filterZoneTasks(filter) {
            currentZoneFilter = filter;
            document.querySelectorAll('.zone-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderZoneContent();
        }

        function renderZoneContent() {
            if (!dashboardState?.tasks) return;
            
            let zoneTasks = dashboardState.tasks.filter(t => t.stage === currentZone);
            
            // Apply tab filter
            if (currentZoneFilter === 'open') {
                zoneTasks = zoneTasks.filter(t => t.state === 'open' && t.type === 'issue');
            } else if (currentZoneFilter === 'closed') {
                zoneTasks = zoneTasks.filter(t => t.state === 'closed' && t.type === 'issue');
            } else if (currentZoneFilter === 'pr') {
                zoneTasks = zoneTasks.filter(t => t.type === 'pr');
            }

            // Calculate stats
            const openCount = zoneTasks.filter(t => t.state === 'open' && t.type === 'issue').length;
            const closedCount = zoneTasks.filter(t => t.state === 'closed' && t.type === 'issue').length;
            const prCount = zoneTasks.filter(t => t.type === 'pr').length;
            const totalCount = zoneTasks.length;
            
            document.getElementById('zoneStats').innerHTML = `
                <div class="zone-stat"><div class="zone-stat-value">${openCount}</div><div class="zone-stat-label">Open Issues</div></div>
                <div class="zone-stat"><div class="zone-stat-value">${closedCount}</div><div class="zone-stat-label">Closed</div></div>
                <div class="zone-stat"><div class="zone-stat-value">${prCount}</div><div class="zone-stat-label">PRs</div></div>
                <div class="zone-stat"><div class="zone-stat-value">${totalCount}</div><div class="zone-stat-label">Total</div></div>
            `;

            // Render task list
            const taskListEl = document.getElementById('zoneTaskList');
            
            if (zoneTasks.length === 0) {
                taskListEl.innerHTML = `
                    <div class="zone-empty">
                        <div class="zone-empty-icon">📭</div>
                        <p>No tasks found for this filter.</p>
                        <p style="margin-top:10px;font-size:12px;">Click "Request Work" to create a new task!</p>
                    </div>
                `;
            } else {
                taskListEl.innerHTML = zoneTasks.map(task => {
                    const agent = dashboardState.agents[task.agent] || {};
                    const labels = task.labels || [];
                    const isPR = task.type === 'pr';
                    const isClosed = task.state === 'closed';
                    
                    return `
                        <div class="zone-task-item ${isPR ? 'pr' : ''} ${isClosed ? 'closed' : ''}">
                            <div class="zone-task-header">
                                <div class="zone-task-title">${task.title}</div>
                                <span class="zone-task-number">#${task.number}</span>
                            </div>
                            <div class="zone-task-meta">
                                <span>${agent.emoji || '🤖'} ${agent.name || task.agent}</span>
                                <span>${isPR ? '🔀 Pull Request' : isClosed ? '✅ Closed' : '📋 Open'}</span>
                                <span>📅 ${new Date(task.createdAt || Date.now()).toLocaleDateString()}</span>
                            </div>
                            <div class="zone-task-desc">${task.body ? task.body.substring(0, 200) + (task.body.length > 200 ? '...' : '') : 'No description provided.'}</div>
                            <div class="zone-task-actions">
                                ${task.url ? `<a href="${task.url}" target="_blank" class="zone-task-btn">🔗 View on GitHub</a>` : ''}
                                <button class="zone-task-btn primary" onclick="openWorkRequestModal('${task.agent}')">📋 Create Work Request</button>
                            </div>
                            ${labels.length > 0 ? `<div class="labels-container">${labels.map(l => `<span class="label ${l}">${l}</span>`).join('')}</div>` : ''}
                        </div>
                    `;
                }).join('');
            }
        }

        function closeZoneModal() {
            document.getElementById('zoneModal').classList.remove('visible');
        }

        // WORK REQUEST MODAL FUNCTIONS
        function openWorkRequestModal(preselectedAgent = null) {
            const modal = document.getElementById('workRequestModal');
            const agentSelect = document.getElementById('targetAgent');
            
            // Populate agent dropdown
            agentSelect.innerHTML = '<option value="">Select an agent...</option>';
            if (dashboardState?.agents) {
                Object.values(dashboardState.agents).forEach(agent => {
                    const option = document.createElement('option');
                    option.value = agent.id;
                    option.innerHTML = `${agent.emoji} ${agent.name} — ${agent.role}`;
                    if (agent.id === preselectedAgent) option.selected = true;
                    agentSelect.appendChild(option);
                });
            }
            
            // Reset form
            document.getElementById('workRequestForm').style.display = 'flex';
            document.getElementById('formSuccess').style.display = 'none';
            document.getElementById('workRequestForm').reset();
            
            modal.classList.add('visible');
        }

        function closeWorkRequestModal() {
            document.getElementById('workRequestModal').classList.remove('visible');
        }

        function resetWorkRequestForm() {
            document.getElementById('workRequestForm').style.display = 'flex';
            document.getElementById('formSuccess').style.display = 'none';
            document.getElementById('formSuccess').style.borderColor = '#00ff88';
            document.getElementById('formSuccess').style.background = 'rgba(0,255,136,0.1)';
            document.getElementById('workRequestForm').reset();
        }

        // Handle work request form submission
        document.getElementById('workRequestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const originalContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner"></div> Creating...';
            
            const targetAgent = document.getElementById('targetAgent').value;
            const taskTitle = document.getElementById('taskTitle').value;
            const taskZone = document.getElementById('taskZone').value;
            const taskDescription = document.getElementById('taskDescription').value;
            const taskPriority = document.getElementById('taskPriority').value;
            const taskLabels = document.getElementById('taskLabels').value;
            
            const agent = dashboardState.agents[targetAgent];
            
            // Build labels array - include 'build', agent label, priority, zone, and custom labels
            const labels = ['build'];
            if (taskLabels) {
                labels.push(...taskLabels.split(',').map(l => l.trim()).filter(l => l));
            }
            
            // Format priority label based on selection
            const priorityLabel = taskPriority; // e.g., 'p0-critical', 'p1-high', etc.
            labels.push(priorityLabel);
            
            // Add zone label
            labels.push(taskZone);
            
            // Add agent label
            labels.push(`agent-${targetAgent}`);
            
            try {
                // Use config or environment variable for GitHub token
                const token = window.DASHBOARD_CONFIG?.GITHUB_TOKEN || window.GITHUB_TOKEN;
                const repo = window.DASHBOARD_CONFIG?.GITHUB_REPO || 'jelly-legs-ai/Jelly-legs-unsteady-workshop';
                
                if (!token) {
                    throw new Error('GitHub token not available. Please configure dashboard-config.js or set GITHUB_TOKEN environment variable.');
                }
                
                const response = await fetch(`https://api.github.com/repos/${repo}/issues`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: `[AGENT] Request: ${taskTitle}`,
                        body: `## Work Request

**Target Agent:** ${targetAgent}
**Zone/Stage:** ${taskZone}
**Priority:** ${taskPriority}

### Description
${taskDescription}

---
*Created via Jelly-Legs Dashboard Work Request System*`,
                        labels: labels
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({});
                    throw new Error(errorData.message || `GitHub API error: ${response.status}`);
                }
                
                const data = await response.json();
                document.getElementById('successMessage').innerHTML = `Issue <strong>#${data.number}</strong> created successfully and assigned to <strong>${agent ? agent.name : targetAgent}</strong>!<br><a href="${data.html_url}" target="_blank" style="color: #00ff88;">View on GitHub →</a>`;
                
                // Add to local state
                const newTask = {
                    id: `issue-${data.number}`,
                    type: 'issue',
                    number: data.number,
                    title: data.title,
                    stage: taskZone,
                    agent: targetAgent,
                    state: 'open',
                    body: taskDescription,
                    createdAt: data.created_at,
                    updatedAt: data.created_at,
                    labels: labels,
                    url: data.html_url
                };
                dashboardState.tasks.push(newTask);
                renderDashboard();
                
            } catch (error) {
                // Show error message
                document.getElementById('successMessage').innerHTML = `<span style="color: #ff6666;">❌ Failed to create issue:</span> ${error.message}
                    <br><br>
                    <button class="zone-task-btn" onclick="closeWorkRequestModal(); openWorkRequestModal('${targetAgent}')" style="margin-top: 10px;"><span>🔄 Try Again</span></button>`;
                document.getElementById('formSuccess').style.borderColor = '#ff6666';
                document.getElementById('formSuccess').style.background = 'rgba(255,102,102,0.1)';
            }
            
            // Show success/error
            document.getElementById('workRequestForm').style.display = 'none';
            document.getElementById('formSuccess').style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalContent;
        });

        // Close modals on overlay click
        document.getElementById('zoneModal').addEventListener('click', function(e) {
            if (e.target === this) closeZoneModal();
        });
        
        document.getElementById('workRequestModal').addEventListener('click', function(e) {
            if (e.target === this) closeWorkRequestModal();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeZoneModal();
                closeWorkRequestModal();
            }
            if (e.ctrlKey && e.key === 'n') {
                e.preventDefault();
                openWorkRequestModal();
            }
        });

        // Hide loading screen
        function hideLoadingScreen() {
            const loading = document.getElementById('loadingScreen');
            loading.classList.add('hidden');
            setTimeout(() => loading.style.display = 'none', 500);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
            
            // Auto-refresh every 60 seconds
            setInterval(loadDashboardData, 60000);
        });
    </script>
</body>
